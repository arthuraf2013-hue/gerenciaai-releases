name: PDV mobile — build do APK Android

# Gera o APK do PDV mobile autônomo (pasta mobile/).
#
# Quando roda:
# - push de uma tag `mobile-vX.Y.Z` (ex.: mobile-v1.0.1) -> APK assinado
#   anexado a uma release do GitHub;
# - manualmente (aba Actions -> "Run workflow") -> APK só como artefato
#   da execução, pra testar.
#
# NÃO interfere no desktop: o release.yml só liga em tags `v*` (uma tag
# `mobile-v...` não casa), e a release criada aqui é marcada como
# PRÉ-LANÇAMENTO e nunca como "latest" -- o atualizador automático do
# GerenciaAI do computador (electron-updater) ignora pré-lançamentos, então
# um APK publicado aqui nunca vira "atualização" pro desktop.
#
# Assinatura (obrigatória pra release): 4 secrets no repositório
#   GERENCIAAI_KEYSTORE_BASE64   arquivo .jks inteiro em base64
#   GERENCIAAI_KEYSTORE_PASSWORD senha do arquivo
#   GERENCIAAI_KEY_ALIAS         alias da chave
#   GERENCIAAI_KEY_PASSWORD      senha da chave
# Como gerar: ver mobile/README.md, "Chave de assinatura". A MESMA chave
# precisa assinar todas as versões -- sem ela os celulares dos clientes
# não aceitam a atualização por cima.

on:
  push:
    tags:
      - "mobile-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Preparar Java 21 (exigido pelo Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Testes (vendas, caixa, licença, backup)
        run: npm test

      - name: Conferir versão da tag x package.json
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        run: |
          VERSAO_TAG="${GITHUB_REF_NAME#mobile-v}"
          VERSAO_PKG="$(node -p "require('./package.json').version")"
          if [ "$VERSAO_TAG" != "$VERSAO_PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME não bate com mobile/package.json ($VERSAO_PKG). Ajuste a versão antes de publicar."
            exit 1
          fi

      - name: Build web + sincronizar com o projeto Android
        run: |
          npx vite build
          node scripts/prepararAndroid.mjs
          npx cap sync android

      - name: Restaurar a chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.GERENCIAAI_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [[ "$GITHUB_REF" == refs/tags/mobile-v* ]]; then
              echo "::error::Publicar versão exige a chave de assinatura nos secrets (ver mobile/README.md)."
              exit 1
            fi
            echo "::warning::Sem chave de assinatura nos secrets — só o APK de teste (debug) vai servir."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gerenciaai.jks"
          echo "GERENCIAAI_KEYSTORE_PATH=$RUNNER_TEMP/gerenciaai.jks" >> "$GITHUB_ENV"

      - name: Gerar APKs
        working-directory: mobile/android
        env:
          GERENCIAAI_KEYSTORE_PASSWORD: ${{ secrets.GERENCIAAI_KEYSTORE_PASSWORD }}
          GERENCIAAI_KEY_ALIAS: ${{ secrets.GERENCIAAI_KEY_ALIAS }}
          GERENCIAAI_KEY_PASSWORD: ${{ secrets.GERENCIAAI_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Organizar arquivos
        run: |
          VERSAO="$(node -p "require('./package.json').version")"
          mkdir -p ../saida
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "../saida/GerenciaAI-PDV-$VERSAO.apk"
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk "../saida/GerenciaAI-PDV-$VERSAO-TESTE.apk"
          ls -la ../saida

      - name: Guardar como artefato da execução
        uses: actions/upload-artifact@v4
        with:
          name: gerenciaai-pdv-apk
          path: saida/*.apk
          retention-days: 30

      - name: Publicar release (pré-lançamento, nunca "latest")
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        uses: softprops/action-gh-release@v2
        with:
          name: PDV mobile ${{ github.ref_name }}
          prerelease: true
          make_latest: false
          files: saida/GerenciaAI-PDV-*.apk
          fail_on_unmatched_files: true
          body: |
            APK do GerenciaAI PDV mobile autônomo (Android 7.0 ou mais novo).
            - `GerenciaAI-PDV-<versão>.apk`: instalar nos celulares dos clientes.
            - `-TESTE.apk`: só pra teste — assinatura diferente, NÃO instale em celular de cliente.
