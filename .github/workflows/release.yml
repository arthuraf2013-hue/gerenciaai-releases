name: Build e publicar release

# Roda sozinho sempre que uma tag no formato v* for enviada ao repositório
# (ex: v0.4.0). Não roda em push comum na branch — só quando uma tag de
# versão é criada de propósito, pra não publicar release a cada commit.
on:
  push:
    tags:
      - "v*"

# Necessário pra o job poder criar a release no próprio repositório.
permissions:
  contents: write

jobs:
  build-e-publicar:
    # NSIS (o instalador do Windows) precisa ser construído numa máquina
    # Windows — o better-sqlite3 também compila o binário nativo certo
    # pra essa plataforma aqui.
    runs-on: windows-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm ci

      - name: Recompilar módulos nativos pro Node do sistema (não o do Electron)
        # O postinstall (`electron-builder install-app-deps`, que já
        # rodou no passo acima) recompila o better-sqlite3 pro Node
        # INTERNO do Electron, não pro Node do sistema que roda os
        # testes (`node --test`) — incompatibilidade de
        # NODE_MODULE_VERSION, os testes nem chegam a rodar. O
        # electron-builder recompila pro Electron de novo sozinho mais
        # adiante (antes de empacotar), então reverter aqui é seguro.
        run: npm rebuild better-sqlite3

      - name: Rodar os testes
        # Sem esse passo, a suíte de testes existe mas nunca protege
        # nada de verdade — regressão nas áreas cobertas só apareceria
        # depois, com cliente reportando. Roda ANTES do build, pra
        # travar a publicação se algo quebrar.
        run: npm test

      - name: Build do frontend (Vite)
        # Sem esse passo, o dist/ (onde fica o index.html de verdade)
        # nunca é gerado nesse ambiente — o dist/ está no .gitignore de
        # propósito, então o checkout não traz ele pronto. Sem isso, o
        # electron-builder empacota um app sem nenhum conteúdo dentro
        # (tela em branco, sem erro nenhum no console, porque nem chega
        # a carregar JavaScript nenhum).
        run: npm run build

      - name: Build e publicar no GitHub Releases
        run: npx electron-builder --publish always
        env:
          # Token automático do próprio GitHub Actions — não precisa do
          # seu token pessoal (GH_TOKEN) pra esse fluxo automatizado.
          # Só continua precisando dele se você publicar manualmente da
          # sua máquina, como fazia antes.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
